# Standalone compose file for running the backend by itself. If you're running the
# full stack, prefer the root ../docker-compose.yml instead — it wires backend,
# frontend, Mongo, and Redis together with nothing to create manually.
services:
  backend:
    build: .
    container_name: sirix-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/sirix
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    networks:
      - sirix-network

  mongo:
    image: mongo:latest
    container_name: sirix-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sirix-network

  redis:
    image: redis:latest
    container_name: sirix-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - sirix-network

volumes:
  mongo_data:
  redis_data:

networks:
  sirix-network:
    name: sirix-network
